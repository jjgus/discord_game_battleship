<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚓ Battleship</title>
  <link rel="stylesheet" href="/game.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>⚓ Battleship</h1>
      <div id="status-bar"></div>
      <button id="audio-toggle" title="Toggle sound" aria-label="Toggle sound" style="margin-left:auto;font-size:20px;line-height:1;background:none;border:none;cursor:pointer;padding:4px 8px;">🔇</button>
    </header>

    <main>
      <!-- CONNECTING -->
      <section id="phase-connecting">
        <div class="spinner"></div>
        <p>Connecting…</p>
      </section>

      <!-- PLACEMENT -->
      <section id="phase-placement" hidden>
        <div class="placement-header">
          <img id="ship-icon" class="ship-icon" src="" alt="" />
          <div id="placement-info">Place ship 1 of 4</div>
          <button id="btn-rotate" class="btn-secondary">🔄 Rotate (R)</button>
        </div>
        <div id="placement-grid" class="grid"></div>
        <p class="hint">Click a cell to place. Press R to rotate.</p>
      </section>

      <!-- WAITING FOR OPPONENT TO PLACE -->
      <section id="phase-waiting-opponent" hidden>
        <div class="spinner"></div>
        <p>Fleet placed! Waiting for opponent…</p>
        <div id="preview-fleet-wrapper">
          <h3>Your Fleet</h3>
          <div id="preview-fleet-grid" class="grid"></div>
        </div>
      </section>

      <!-- CANCELLED during placement -->
      <section id="phase-cancelled" hidden>
        <p id="cancelled-msg" style="font-size:1.1rem;color:var(--text-dim);text-align:center;"></p>
      </section>
    </main>
  </div>

  <script>window.__GAME_DATA__ = {}</script>
  <script src="/grid.js"></script>
  <script src="/sfx.js"></script>
  <script src="/music.js"></script>
  <script src="/game.js"></script>
  <script src="/ship-overlay.js"></script>
  <script>
    window.__audio = { on: false, unlocked: false };

    window.startMusic = function () {
      if (window.__audio.on && window.__audio.unlocked) BattleshipMusic.start();
    };

    const audioBtn = document.getElementById('audio-toggle');

    // First interaction: unlock Web Audio. Auto-start music unless the user's
    // first gesture is the toggle button (toggle click manages that case itself).
    document.addEventListener('pointerdown', function unlockAudio(e) {
      document.removeEventListener('pointerdown', unlockAudio);
      window.__audio.unlocked = true;
      BattleshipSFX.unlock();
      if (!e.target.closest('#audio-toggle')) {
        window.__audio.on = true;
        BattleshipSFX.muted = false;
        audioBtn.textContent = '🔊';
        window.startMusic();
      }
    });

    audioBtn.addEventListener('click', () => {
      if (!window.__audio.unlocked) {
        window.__audio.unlocked = true;
        BattleshipSFX.unlock();
      }
      window.__audio.on = !window.__audio.on;
      BattleshipSFX.muted = !window.__audio.on;
      audioBtn.textContent = window.__audio.on ? '🔊' : '🔇';
      if (window.__audio.on) window.startMusic();
      else BattleshipMusic.stop();
    });
  </script>
</body>
</html>
