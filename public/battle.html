<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚔️ Battle — Battleship</title>
  <link rel="stylesheet" href="/game.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>⚔️ Battleship</h1>
      <div id="status-bar"></div>
      <button id="audio-toggle" title="Toggle sound" aria-label="Toggle sound" style="margin-left:auto;font-size:20px;line-height:1;background:none;border:none;cursor:pointer;padding:4px 8px;">🔊</button>
    </header>

    <main>
      <!-- CONNECTING / loading battle state -->
      <section id="phase-connecting">
        <div class="spinner"></div>
        <p>Loading battle…</p>
      </section>

      <!-- BATTLE -->
      <section id="phase-battle" hidden>
        <div id="turn-banner"></div>
        <div id="spyglass-banner" hidden></div>
        <div class="battle-area">
          <div class="board">
            <h3>Enemy Fleet</h3>
            <div id="enemy-fleet-status" class="fleet-status"></div>
            <div id="enemy-grid" class="grid"></div>
          </div>
          <div class="board">
            <h3>Your Fleet</h3>
            <div id="my-fleet-status" class="fleet-status"></div>
            <div id="my-grid" class="grid"></div>
          </div>
        </div>
      </section>

      <!-- GAME OVER -->
      <section id="phase-done" hidden>
        <div id="result-box">
          <div id="result-icon"></div>
          <div id="result-title"></div>
          <div id="result-sub"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="/grid.js"></script>
  <script src="/sfx.js"></script>
  <script src="/music.js"></script>
  <script src="/battle.js"></script>
  <script src="/ship-overlay.js"></script>
  <script>
    window.__audio = { on: true, unlocked: false };

    // Attempt autoplay immediately. The AudioContext starts suspended in most
    // browsers; music.js calls ctx.resume() inside its 25ms tick — so music
    // begins as soon as the user makes any gesture (click, keypress, etc.).
    BattleshipMusic.start();

    // battle.js calls this on battleResume; start() is idempotent when playing
    window.startMusic = function () {
      if (window.__audio.on) BattleshipMusic.start();
    };

    const audioBtn = document.getElementById('audio-toggle');

    // Unlock SFX engine on first interaction (music.js handles its own resume)
    document.addEventListener('pointerdown', function unlockSFX() {
      document.removeEventListener('pointerdown', unlockSFX);
      window.__audio.unlocked = true;
      BattleshipSFX.unlock();
    }, { passive: true });

    audioBtn.addEventListener('click', () => {
      window.__audio.on = !window.__audio.on;
      BattleshipSFX.muted = !window.__audio.on;
      audioBtn.textContent = window.__audio.on ? '🔊' : '🔇';
      if (window.__audio.on) BattleshipMusic.start();
      else BattleshipMusic.stop();
    });
  </script>
</body>
</html>
